  <div id="root"></div>

      {id:1,name:"MESOCYCLE I",label:"Foundation & Density",weeks:"Weeks 1–4",col:"#E8920A",

       dupPattern:["Wk1: Hypertrophy 8–12 reps @70–75%","Wk2: Str-Hyp 6–8 reps @75–80%","Wk3: Strength 4–6 reps @80–85%","Wk4: DELOAD @60–65%"],
       goals:["Rebuild work capacity post-powerlifting meet","Establish 3-run/week aerobic base","HYROX station technique introduction","Maintain strength, begin hypertrophy shift"],

      {id:2,name:"MESOCYCLE II",label:"Strength-Hypertrophy",weeks:"Weeks 5–8",col:"#2a82c4",

       loading:{deadlift:[{wk:9,scheme:"5@82% / 2@89%",backoff:"2×2 @80% + 1@92%",note:""},{wk:10,scheme:"4@84% / 2@90%",backoff:"Single @93%",note:""},{wk:11,scheme:"3@85% / 1@91%",backoff:"3-attempt simulation",note:"Opener / Second / Max."},{wk:12,scheme:"DELOAD: 3×3 @70%",backoff:"—",note:""}],frontSquat:[{wk:9,scheme:"3@79% / 2@85% / 1@91%",backoff:"Max attempt",note:""},{wk:10,scheme:"3@81% / 2@87% / 1@93%",backoff:"Max single",note:""},{wk:11,scheme:"2@83% / 2@89% / 1@95%+",backoff:"PR attempt",note:"MC3 peak."},{wk:12,scheme:"DELOAD: 3×3 @68%",backoff:"—",note:""}],backSquat:[{wk:9,scheme:"5@82% / 3@88% / 1@93%",backoff:"",note:""},{wk:10,scheme:"4@83% / 2@90% / 1@94%",backoff:"",note:""},{wk:11,scheme:"3@85% / 2@91% / 1 MAX+",backoff:"",note:""},{wk:12,scheme:"DELOAD: 3×5 @72%",backoff:"—",note:""}],bench:[{wk:9,scheme:"5@80% / 3@87% / 1@92%",backoff:"2×4 @78%",note:""},{wk:10,scheme:"4@82% / 2@89% / 1@93%",backoff:"",note:""},{wk:11,scheme:"3@84% / 1@91% / 1 MAX",backoff:"",note:""},{wk:12,scheme:"DELOAD: 3×8 @70%",backoff:"—",note:""}]},
       running:{easy:"45 min | Zone 2 | HR 130–145 | Recovery anchor from heavy strength work.",tempo:"4×10 min @threshold | Wk11: 1×30 min continuous | 2 min jog.",track:"5×800m @5k pace | 2.5 min rest | Wk11: 3×1200m."},
       conditioning:{label:"HYROX Half-Simulations",desc:"4-station segments with 1km runs between. Find weak stations before race day.",sessions:["Wk9: Half A | 1km Run + 1000m Row + 1km Run + Sled Push + 1km Run + Sled Pull + 1km Run + Burpee Broad Jumps | Target sub-45 min","Wk10: Half B | 1km Run + Ski Erg + 1km Run + Farmer's Carry + 1km Run + Sandbag Lunges + 1km Run + 50 Wall Balls","Wk11: Weak station focus | 6 targeted rounds on 2 slowest stations + 1km runs between","Wk12: DELOAD | 3 easy rounds at 60% effort"]}},
      {id:4,name:"MESOCYCLE IV",label:"Power + Conditioning",weeks:"Weeks 13–16",col:"#20884A",
       analogy:"Breaking in the horse — the cattle work starts for real. Speed, endurance, efficiency.",
       focus:"Transition: strength → HYROX conditioning · Running race-pace peak",
       dupPattern:["Wk13: Power 2–3 reps + speed work","Wk14: Str-Power 3–4 reps @80%+","Wk15: Conditioning peak / str maintenance","Wk16: DELOAD"],
       goals:["Full HYROX simulations beginning","Running at near race-pace on tempo and track","Conditioning volume at highest point","Body comp: natural lean-out from conditioning peak"],
       loading:{deadlift:[{wk:13,scheme:"5@78% + 3×3 speed @60% EMOM",backoff:"1@85%",note:"Speed pulls: :20/:40. Explosive every rep."},{wk:14,scheme:"5@80% + 3×2 speed @63%",backoff:"1@87%",note:""},{wk:15,scheme:"3@83% + 3×2 speed @65%",backoff:"1@88%",note:"Last heavy DL before conditioning peaks."},{wk:16,scheme:"DELOAD: 3×5 @68%",backoff:"—",note:""}],frontSquat:[{wk:13,scheme:"4×4 @76% maintenance",backoff:"",note:"Technique focus."},{wk:14,scheme:"4×4 @78%",backoff:"",note:""},{wk:15,scheme:"4×3 @80%",backoff:"",note:""},{wk:16,scheme:"DELOAD: 3×3 @65%",backoff:"—",note:""}],backSquat:[{wk:13,scheme:"5@78% / 3@84% / 1@89% + speed",backoff:"",note:""},{wk:14,scheme:"5@80% / 3@85% / 1@90%",backoff:"",note:""},{wk:15,scheme:"3×5 @78% maintenance",backoff:"",note:"Conditioning is the priority."},{wk:16,scheme:"DELOAD: 3×5 @68%",backoff:"—",note:""}],bench:[{wk:13,scheme:"3×10 @72% hypertrophy",backoff:"",note:"Volume for body comp."},{wk:14,scheme:"3×10 @74%",backoff:"",note:""},{wk:15,scheme:"4×8 @75%",backoff:"",note:""},{wk:16,scheme:"DELOAD: 3×12 @65%",backoff:"—",note:""}]},
       running:{easy:"45–50 min | Zone 2 | HR 128–142 | Volume builds, intensity stays controlled.",tempo:"3×12 min @threshold | Wk15: 2×20 min continuous.",track:"6×600m @race pace | Wk15: 8×400m faster than race pace."},
       conditioning:{label:"Full HYROX Simulations",desc:"Complete 8-station simulations. Time awareness and pacing — not suffering.",sessions:["Wk13: Full HYROX sim @75% effort | Track every station split | Assess, don't race","Wk14: Full HYROX sim @80% | Use Wk13 splits to adjust pacing","Wk15: Full HYROX @85% + 2× targeted station intervals after","Wk16: DELOAD | Partial sim (4 stations + 4km) at 60% effort"]}},

       goals:["Timed mock HYROX — personal baseline","Body composition: visible lean-out","Strength: maintained at 85–90% of peak","Debrief and plan next cycle"],
       loading:{deadlift:[{wk:17,scheme:"3×5 @77% maintenance",backoff:"",note:""},{wk:18,scheme:"3×5 @75%",backoff:"",note:"Mock event week."},{wk:19,scheme:"2×5 @73% taper",backoff:"",note:""},{wk:20,scheme:"MOCK EVENT WEEK — light only",backoff:"—",note:""}],frontSquat:[{wk:17,scheme:"3×4 @77% maintenance",backoff:"",note:""},{wk:18,scheme:"3×3 @75%",backoff:"",note:""},{wk:19,scheme:"2×3 @73% taper",backoff:"",note:""},{wk:20,scheme:"Skip or 2×3 @65% shakeout",backoff:"—",note:""}],backSquat:[{wk:17,scheme:"3×5 @79% maintenance",backoff:"",note:""},{wk:18,scheme:"3×5 @77%",backoff:"",note:""},{wk:19,scheme:"2×5 @74% taper",backoff:"",note:""},{wk:20,scheme:"MOCK EVENT WEEK — skip",backoff:"—",note:""}],bench:[{wk:17,scheme:"4×10 @72% body comp",backoff:"",note:""},{wk:18,scheme:"3×12 @70%",backoff:"",note:""},{wk:19,scheme:"3×12 @68% taper",backoff:"",note:""},{wk:20,scheme:"Light pump work only",backoff:"—",note:""}]},
       running:{easy:"40 min | Wk19–20: 30 min | Zone 2 | Taper volume, not consistency.",tempo:"Wk17: 2×15 min | Wk18: 1×20 min | Wk19: 15 min easy | Wk20: 20 min shakeout",track:"Wk17: 6×400m race pace | Wk18: 4×400m sharpener | Wk19–20: 4×200m strides only"},
       conditioning:{label:"Mock HYROX + Taper",desc:"Two shots at the clock, then taper into body comp maintenance.",sessions:["Wk17: Final full sim @90%+ | Best time attempt | Log every station split","Wk18: MOCK HYROX — Full timed attempt | Race it. This is the event.","Wk19: Body comp conditioning | 3 rounds: 20 min Bike + 10 min Row + 15 min incline walk","Wk20: Rest and reflect | Light movement only | Plan the next cycle"]}}
    ];

    const days = [
      {id:0,weekday:"MON",label:"Day 2 — Posterior",sub:"Posterior Chain + Shoulders + Tris",type:"LIFT",
       exercises:[{name:"CONVENTIONAL DEADLIFT ★★★",protocol:"→ Mesocycle loading table",note:"PRIMARY. Brace first. Lat tension before leaving the floor."},{name:"GHD Hamstring Curl / Nordic Curl",protocol:"3×8–10 | 3–4 sec eccentric",note:"Replaces hip thrust. Nordics build deceleration strength your running needs."},{name:"Feet Elevated Ring Row",protocol:"3×Max | add load when >15 reps",note:"Full scapular retraction. Dead hang at bottom."},{name:"DB Shoulder Press",protocol:"4×10 | Arnold or standard | seated",note:""},{name:"T-Bar Row",protocol:"4×10 | alternate wide/narrow grip weekly",note:""},{name:"Laterals",protocol:"4×15 | cable or DB | slow",note:""},{name:"Tricep Pushdown",protocol:"4×Max | rope or straight bar",note:""},{name:"Farmer's Carry",protocol:"3×100ft | 24–32kg/hand",note:""},{name:"Backwards Sled Walk",protocol:"3×50m | moderate load",note:"VMO + glute. Direct HYROX sled transfer."},{name:"Abs — GHD Sit-Ups",protocol:"3×20 | progress to weighted",note:""}]},
      {id:1,weekday:"TUE",label:"Easy Run",sub:"Zone 2 Aerobic Development",type:"RUN",
       exercises:[{name:"Zone 2 Run",protocol:"→ Mesocycle running table | HR 130–145",note:"Hold a full conversation. If you can't, back off."},{name:"Post-Run Mobility",protocol:"10 min | hip flexor + calf + hamstring",note:"Non-negotiable."}]},
      {id:2,weekday:"WED",label:"Day 1 + Tempo Run",sub:"Full Body AM | Threshold Run PM",type:"LIFT+RUN",
       exercises:[{name:"BULGARIAN SPLIT SQUAT ★★",protocol:"8RM work-up | 3 sets at 8RM | +5lbs when all 3 clean",note:"PRIMARY unilateral driver."},{name:"Barbell Strict Press",protocol:"5×5 + 1 max set @80% of top set",note:"Second strict press day of the week."},{name:"DB Incline Bench",protocol:"3×10–12 | full stretch at bottom",note:""},{name:"SA DB Row",protocol:"3×10–12/arm | straps allowed",note:""},{name:"Calves",protocol:"3×15–20 | leg press or standing | full stretch",note:""},{name:"Chin-Ups",protocol:"3×AMRAP | add weight when >12 reps",note:""},{name:"Walking Lunges",protocol:"3×100ft | DBs or sandbag",note:"Direct HYROX sandbag lunge transfer."},{name:"— PM: TEMPO RUN —",protocol:"→ Mesocycle running table | 4–6 hrs after lifting",note:"Substitute easy 30 min if fatigued."}]},
      {id:3,weekday:"THU",label:"Day 3 — Quads/Hams",sub:"Front Squat + GHR + Chest/Back",type:"LIFT",
       exercises:[{name:"FRONT SQUAT ★★★",protocol:"3-2-1-Max | → Mesocycle loading table",note:"PRIMARY GOAL LIFT. Wrist warm-up mandatory. Film every heavy single."},{name:"Weighted Pull-Up / Lat Pulldown AHAP",protocol:"5RM pull-up OR heavy lat pulldown | 3–4 sets",note:""},{name:"GHR (Glute-Ham Raise)",protocol:"3×10 | progress load when controlled",note:"Non-negotiable every session."},{name:"Weighted Push-Ups / Dips",protocol:"3×Max | vest or plate | alternate weekly",note:""},{name:"Seated DB Laterals + Standing Laterals",protocol:"3×12–15 each",note:""},{name:"Bayesian Rear Delt Fly",protocol:"3×12 | cable, single arm",note:""},{name:"Back Extension",protocol:"3×20 | BW → weighted | full ROM",note:""},{name:"Leg Extension",protocol:"3×20 | slow eccentric | peak squeeze",note:""}]},
      {id:4,weekday:"FRI",label:"Track Intervals",sub:"Speed + Lactate Clearance",type:"RUN",

      {id:5,weekday:"SAT",label:"Day 4 + HYROX",sub:"Back Squat + Chest + Arms AM | HYROX PM",type:"LIFT+HYROX",
       exercises:[{name:"BACK SQUAT ★★★",protocol:"5-3-1-Max | → Mesocycle loading table",note:"PRIMARY. Low-bar. Belt for work sets."},{name:"Bench Press",protocol:"→ Mesocycle loading table | scheme varies by MC",note:"Hypertrophy MC1 · Strength MC2–3 · Volume MC4–5."},{name:"Barbell Row",protocol:"4×10 | 185–215 building | alternate grip weekly",note:""},{name:"Reverse Lunges",protocol:"4×12/leg | barbell or DB",note:""},{name:"Filly Press",protocol:"3×10/side | banded or cable",note:""},{name:"Side Lying Laterals",protocol:"3×10 | slow",note:""},{name:"CBUM Arms A",protocol:"3–4 rounds: Preacher Curl → Rope French Press → Decline Skull Crusher",note:""},{name:"CBUM Arms B",protocol:"3–4 rounds: Reverse Preacher → Incline Curl → Rope Pushdown",note:""},{name:"— PM: HYROX CONDITIONING —",protocol:"→ Mesocycle conditioning block | 3–4 hrs after lifting",note:"Fuel between sessions."}]},
      {id:6,weekday:"SUN",label:"Rest",sub:"Full Recovery — Mandatory",type:"REST",
       exercises:[{name:"Full Rest",protocol:"No structured training",note:""},{name:"Optional",protocol:"20 min walk + mobility only",note:""}]}
    ];

    function LogPanel({day, mc, defaultWeek, onSave, onClose, lastSession}) {
      const col = dayColors[day.type]||"#555";
      const isRun = day.type==="RUN";
      const isRest = day.type==="REST";
      const [date, setDate] = useState(todayStr());
      const [weekNum, setWeekNum] = useState(defaultWeek);
      const [entries, setEntries] = useState({});
      const [note, setNote] = useState("");
      const upd = (key,field,val) => setEntries(e=>({...e,[key]:{...(e[key]||{}),[field]:val}}));
      const lastE = lastSession?.entries||{};

      function handleSave() {
        onSave({id:Date.now(),date,weekNum,mcId:mc.id,dayId:day.id,dayLabel:day.label,type:day.type,entries,note,ts:Date.now()});
      }

      const liftInputStyle = {width:"100%",background:"#111116",border:"1px solid #252530",color:"#A09878",borderRadius:3,padding:"5px 6px",fontSize:10};
      const labelStyle = {fontSize:8,letterSpacing:".12em",color:"#444",marginBottom:3,display:"block"};

      return (
        <div style={{position:"fixed",inset:0,background:"rgba(10,10,14,0.98)",zIndex:200,overflowY:"auto"}}>
          <div style={{maxWidth:600,margin:"0 auto",padding:"16px 16px 40px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:16}}>
              <div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,letterSpacing:".2em",color:"#444",marginBottom:2}}>LOG SESSION</div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:col,letterSpacing:".04em"}}>{day.label}</div>
                <div style={{fontSize:10,color:"#555",marginTop:2}}>{day.sub}</div>
              </div>
              <button onClick={onClose} style={{background:"transparent",border:"1px solid #252530",color:"#666",borderRadius:4,padding:"5px 10px",fontSize:11,cursor:"pointer",marginTop:4}}>✕ Cancel</button>
            </div>

            <div style={{display:"flex",gap:8,marginBottom:16}}>
              <div style={{flex:1}}><label style={labelStyle}>DATE</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...liftInputStyle,width:"100%"}} /></div>
              <div style={{width:90}}><label style={labelStyle}>WEEK #</label><input type="number" min={1} max={20} value={weekNum} onChange={e=>setWeekNum(Number(e.target.value))} style={{...liftInputStyle,width:"100%"}} /></div>
            </div>

            {lastSession && (
              <div style={{background:"#111116",border:"1px solid #1e1e28",borderRadius:6,padding:"8px 12px",marginBottom:12}}>
                <div style={{fontSize:9,letterSpacing:".1em",color:"#444",marginBottom:4}}>LAST SESSION — {lastSession.date} (Wk {lastSession.weekNum})</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:"3px 14px"}}>
                  {Object.entries(lastSession.entries||{}).slice(0,5).map(([name,data])=>(
                    <div key={name} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#666"}}>
                      {name.replace(/★+/g,"").trim().slice(0,18)}: {[data.weight&&`${data.weight}lb`,data.setsreps,data.rpe&&`RPE${data.rpe}`,data.dist&&`${data.dist}mi`].filter(Boolean).join(" ")||"—"}
                    </div>
                  ))}
                </div>
                {lastSession.note&&<div style={{fontSize:9,color:"#444",marginTop:4,fontStyle:"italic"}}>{lastSession.note.slice(0,80)}{lastSession.note.length>80?"...":""}</div>}
              </div>
            )}

            {isRest ? null : isRun ? (
              <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700,color:col,letterSpacing:".1em",marginBottom:4}}>RUN DATA</div>
                {[["Distance (mi)","dist"],["Total Time (mm:ss)","time"],["Avg HR (bpm)","hr"],["Avg Pace (min/mi)","pace"]].map(([lbl,field])=>(
                  <div key={field}>
                    <label style={labelStyle}>{lbl}</label>
                    <input value={entries["run"]?.[field]||""} onChange={e=>upd("run",field,e.target.value)} placeholder={lastE["run"]?.[field]||""} style={{...liftInputStyle,width:"100%"}} />
                  </div>
                ))}
              </div>
            ) : (
              <div style={{marginBottom:12}}>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700,color:col,letterSpacing:".1em",marginBottom:8}}>EXERCISES</div>
                <div style={{border:"1px solid #1e1e28",borderRadius:6,overflow:"hidden"}}>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 80px 90px 52px",gap:4,padding:"6px 10px",background:"#13131c"}}>
                    {["Exercise","Weight","Sets×Reps","RPE"].map(h=><div key={h} style={{fontSize:8,letterSpacing:".1em",color:"#444",fontWeight:700}}>{h}</div>)}
                  </div>
                  {day.exercises.map((ex,i)=>{
                    const isPrimary = ex.name.includes("★★★")||ex.name.includes("★★");
                    const isSection = ex.name.startsWith("—");
                    if(isSection) return (
                      <div key={i} style={{padding:"7px 10px",background:"#0d1018",borderTop:"1px solid #1e1e28"}}>
                        <div style={{fontSize:10,color:"#2a82c4",fontWeight:700}}>{ex.name}</div>
                        <div style={{fontSize:9,color:"#444",marginTop:2}}>{ex.protocol}</div>
                      </div>
                    );
                    const key=ex.name;
                    return (
                      <div key={i} style={{display:"grid",gridTemplateColumns:"1fr 80px 90px 52px",gap:4,padding:"7px 10px",background:i%2===1?"#0d0d16":"transparent",borderTop:"1px solid #16161e",alignItems:"center"}}>
                        <div style={{fontSize:10,color:isPrimary?col:"#C4B8A8",fontWeight:isPrimary?700:400,lineHeight:1.3}}>{ex.name.replace(/★+/g,"").trim()}</div>
                        <input value={entries[key]?.weight||""} onChange={e=>upd(key,"weight",e.target.value)} placeholder={lastE[key]?.weight||"lbs"} style={liftInputStyle} />
                        <input value={entries[key]?.setsreps||""} onChange={e=>upd(key,"setsreps",e.target.value)} placeholder={lastE[key]?.setsreps||"4×5"} style={liftInputStyle} />
                        {isPrimary
                          ? <input type="number" min={1} max={10} step={0.5} value={entries[key]?.rpe||""} onChange={e=>upd(key,"rpe",e.target.value)} placeholder={lastE[key]?.rpe||""} style={liftInputStyle} />
                          : <div/>}
                      </div>
                    );
                  })}
                </div>
                {(day.type==="LIFT+RUN"||day.type==="LIFT+HYROX") && (
                  <div style={{marginTop:10}}>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700,color:"#2a82c4",letterSpacing:".1em",marginBottom:6}}>{day.type==="LIFT+RUN"?"PM TEMPO RUN":"PM HYROX CONDITIONING"}</div>
                    <div style={{display:"flex",gap:8}}>
                      {day.type==="LIFT+RUN"
                        ? [["Distance","dist"],["Time","time"],["Avg HR","hr"]].map(([lbl,f])=><div key={f} style={{flex:1}}><label style={labelStyle}>{lbl}</label><input value={entries["pm"]?.[f]||""} onChange={e=>upd("pm",f,e.target.value)} style={{...liftInputStyle,width:"100%"}} /></div>)
                        : <div style={{flex:1}}><label style={labelStyle}>TOTAL TIME + STATION SPLITS</label><textarea rows={3} value={entries["pm"]?.splits||""} onChange={e=>upd("pm","splits",e.target.value)} placeholder="Total time + any station notes..." style={{...liftInputStyle,width:"100%",resize:"vertical"}} /></div>}
                    </div>
                  </div>
                )}
              </div>
            )}

            <div style={{marginBottom:16}}>
              <label style={labelStyle}>SESSION NOTES</label>
              <textarea value={note} onChange={e=>setNote(e.target.value)} rows={3} placeholder="How did it feel? PRs, misses, adjustments..." style={{...liftInputStyle,width:"100%",resize:"vertical"}} />
            </div>

            <button onClick={handleSave} style={{width:"100%",padding:"13px",background:col,border:"none",color:"#0A0A0E",borderRadius:6,fontFamily:"'Barlow Condensed',sans-serif",fontSize:16,fontWeight:900,letterSpacing:".06em",cursor:"pointer"}}>
              SAVE SESSION ✓
            </button>
          </div>
        </div>
      );
    }

    function HistoryView({sessions, onDelete, onExport}) {
      const [expanded, setExpanded] = useState(null);
      const sorted = [...sessions].sort((a,b)=>b.ts-a.ts);
      return (
        <div style={{padding:"14px 16px 52px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
            <div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:"#E0D8CC"}}>SESSION HISTORY</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#444",marginTop:2}}>{sessions.length} sessions logged</div>
            </div>
            {sessions.length>0&&<button onClick={onExport} style={{background:"transparent",border:"1px solid #252530",color:"#666",borderRadius:4,padding:"5px 10px",fontSize:10,cursor:"pointer",fontFamily:"'Barlow Condensed',sans-serif",letterSpacing:".05em"}}>↓ EXPORT JSON</button>}
          </div>
          {sorted.length===0?(
            <div style={{textAlign:"center",padding:"48px 20px",color:"#333",fontSize:12}}>
              <div style={{fontSize:28,marginBottom:8}}>📋</div>
              No sessions logged yet.<br/>Hit "Log Session" on any training day to get started.
            </div>
          ):sorted.map(s=>{
            const dayObj = days.find(d=>d.id===s.dayId)||{type:"LIFT"};
            const col = dayColors[dayObj.type]||"#555";
            const isExp = expanded===s.id;
            return (
              <div key={s.id} style={{marginBottom:5,border:`1px solid ${isExp?col+"35":"#1e1e28"}`,borderRadius:6,overflow:"hidden"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",cursor:"pointer",background:isExp?"#0f0f18":"transparent"}} onClick={()=>setExpanded(isExp?null:s.id)}>
                  <div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#444"}}>Wk {s.weekNum} · {s.date} · MC{s.mcId}</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:14,fontWeight:700,color:col,marginTop:2}}>{s.dayLabel}</div>
                  </div>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <button onClick={e=>{e.stopPropagation();if(window.confirm("Delete this session?"))onDelete(s.id);}} style={{background:"transparent",border:"1px solid #D0351530",color:"#D03515",borderRadius:3,padding:"3px 7px",fontSize:9,cursor:"pointer"}}>✕</button>
                    <div style={{color:"#333",fontSize:11}}>{isExp?"▲":"▼"}</div>
                  </div>
                </div>
                {isExp&&(
                  <div style={{padding:"10px 12px",borderTop:"1px solid #1e1e28"}}>
                    {Object.entries(s.entries||{}).map(([name,data])=>{
                      const vals=[data.weight&&`${data.weight}lb`,data.setsreps,data.rpe&&`RPE ${data.rpe}`,data.dist&&`${data.dist}mi`,data.time,data.hr&&`${data.hr}bpm`,data.splits].filter(Boolean).join(" · ");
                      if(!vals&&!data.splits)return null;
                      return(
                        <div key={name} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"5px 0",borderBottom:"1px solid #16161e",gap:8}}>
                          <div style={{fontSize:10,color:"#777",flex:1,minWidth:0}}>{name.replace(/★+/g,"").trim()}</div>
                          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#A09878",flexShrink:0}}>{vals}</div>
                        </div>
                      );
                    })}
                    {s.note&&<div style={{fontSize:10,color:"#555",marginTop:8,fontStyle:"italic",borderTop:"1px solid #1a1a24",paddingTop:8}}>{s.note}</div>}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    function App() {
      const [activeMC, setActiveMC] = useState(0);
      const [activeDay, setActiveDay] = useState(0);
      const [liftView, setLiftView] = useState("deadlift");
      const [view, setView] = useState("program");
      const [logging, setLogging] = useState(false);
      const [sessions, setSessions] = useState([]);

      useEffect(()=>{ setSessions(loadSessions()); },[]);

      function saveSession(session) {
        const updated=[...sessions,session];
        setSessions(updated);
        saveSessions(updated);
        setLogging(false);
      }
      function deleteSession(id) {
        const updated=sessions.filter(s=>s.id!==id);
        setSessions(updated);
        saveSessions(updated);
      }
      function exportSessions() {
        const blob=new Blob([JSON.stringify(sessions,null,2)],{type:"application/json"});
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a");
        a.href=url; a.download="sanctum-ph3-log.json"; a.click();
      }

      const mc=mesocycles[activeMC];
      const day=days[activeDay];
      const col=mc.col;
      const dCol=dayColors[day.type]||"#555";
      const lastSess=getLastSession(sessions,day.id);
      const sessionCount=sessions.filter(s=>s.dayId===day.id).length;

      return (
        <div style={{fontFamily:"'Barlow',system-ui,sans-serif",background:"#0A0A0E",minHeight:"100vh",color:"#E0D8CC"}}>
          <style>{`@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');*{box-sizing:border-box;}::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}button{cursor:pointer;transition:all .15s;}`}</style>

          {logging&&<LogPanel day={day} mc={mc} defaultWeek={mcStartWeek[activeMC]} onSave={saveSession} onClose={()=>setLogging(false)} lastSession={lastSess} />}

          <div style={{padding:"14px 16px 10px",borderBottom:"1px solid #1e1e2a",background:"#0A0A0E",display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
            <div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:900,letterSpacing:".07em",color:"#20884A",lineHeight:1}}>SANCTUM — PHASE III</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,letterSpacing:".2em",color:"#3a3a44",marginTop:2}}>20-WEEK · STRENGTH + HYROX + RUNNING HYBRID</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#444",marginTop:4}}>{sessions.length} sessions logged</div>
            </div>
            <div style={{display:"flex",gap:6,marginTop:4}}>
              {["program","history"].map(v=>(
                <button key={v} onClick={()=>setView(v)} style={{padding:"5px 10px",border:`1px solid ${view===v?"#20884A":"#252530"}`,background:view===v?"#20884A18":"transparent",color:view===v?"#20884A":"#555",borderRadius:4,fontSize:10,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:".06em"}}>
                  {v==="program"?"PROGRAM":"HISTORY"}{v==="history"&&sessions.length>0?` (${sessions.length})`:""}
                </button>
              ))}
            </div>
          </div>

          {view==="history"?(
            <HistoryView sessions={sessions} onDelete={deleteSession} onExport={exportSessions} />
          ):(
            <>
              <div style={{padding:"8px 16px",borderBottom:"1px solid #1a1a24",background:"#0e0e14"}}>
                <div style={{fontSize:8,letterSpacing:".18em",color:"#3a3a44",marginBottom:5,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>WEEKLY TEMPLATE</div>
                <div style={{display:"flex",gap:4,overflowX:"auto",paddingBottom:2}}>
                  {days.map((d,i)=>{
                    const dc=dayColors[d.type]||"#444";
                    const cnt=sessions.filter(s=>s.dayId===d.id).length;
                    return(
                      <button key={i} onClick={()=>setActiveDay(i)} style={{flexShrink:0,background:i===activeDay?`${dc}18`:"#0f0f16",border:`1px solid ${i===activeDay?dc:"#1e1e28"}`,borderRadius:5,padding:"6px 9px",textAlign:"left",minWidth:76}}>
                        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:dc}}>{d.weekday}</div>
                        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,fontWeight:700,color:i===activeDay?"#E0D8CC":"#555",marginTop:2,lineHeight:1.2}}>{d.label}</div>
                        {cnt>0&&<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:"#3a3a44",marginTop:2}}>{cnt} logged</div>}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div style={{display:"flex",overflowX:"auto",borderBottom:"1px solid #1a1a24",background:"#0e0e14"}}>
                {mesocycles.map((m,i)=>(
                  <button key={i} onClick={()=>setActiveMC(i)} style={{flexShrink:0,padding:"9px 13px",border:"none",borderBottom:`2px solid ${activeMC===i?m.col:"transparent"}`,background:activeMC===i?`${m.col}10`:"transparent",color:activeMC===i?m.col:"#555",textAlign:"left"}}>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:8,letterSpacing:".1em",fontWeight:700}}>{m.name}</div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:11,fontWeight:700,color:activeMC===i?"#E0D8CC":"#444",marginTop:1}}>{m.label}</div>
                    <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:"#3a3a44",marginTop:1}}>{m.weeks}</div>
                  </button>
                ))}
              </div>

              <div style={{padding:"10px 16px",borderBottom:"1px solid #1a1a24",background:"#0e0e16"}}>
                <div style={{fontSize:10,color:"#888",fontStyle:"italic",borderLeft:`3px solid ${col}`,paddingLeft:10,marginBottom:6}}>"{mc.analogy}"</div>
                <div style={{fontSize:10,color:"#666",marginBottom:7}}>{mc.focus}</div>
                <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:7}}>
                  {mc.goals.map(g=><div key={g} style={{fontSize:9,padding:"2px 7px",background:`${col}0d`,border:`1px solid ${col}1e`,borderRadius:3,color:"#999"}}>{g}</div>)}
                </div>
                <div style={{display:"flex",flexWrap:"wrap",gap:3}}>
                  {mc.dupPattern.map((d,i)=><div key={i} style={{fontSize:8,padding:"2px 7px",background:"#111116",border:"1px solid #1e1e28",borderRadius:3,color:"#555",fontFamily:"'JetBrains Mono',monospace"}}>{d}</div>)}
                </div>
              </div>

              <div style={{padding:"10px 16px",borderBottom:"1px solid #1a1a24"}}>
                <div style={{fontSize:8,letterSpacing:".18em",color:"#444",marginBottom:7,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>PRIMARY LIFT LOADING — {mc.name}</div>
                <div style={{display:"flex",gap:4,marginBottom:7,flexWrap:"wrap"}}>
                  {[["deadlift","DEADLIFT"],["frontSquat","FRONT SQ"],["backSquat","BACK SQ"],["bench","BENCH"]].map(([k,lbl])=>(
                    <button key={k} onClick={()=>setLiftView(k)} style={{padding:"3px 9px",border:`1px solid ${liftView===k?col:"#252530"}`,background:liftView===k?`${col}14`:"#111116",color:liftView===k?col:"#555",borderRadius:3,fontSize:9,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:".05em"}}>{lbl}</button>
                  ))}
                </div>
                <div style={{overflowX:"auto",borderRadius:5,border:"1px solid #1e1e28"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",minWidth:360}}>
                    <thead><tr style={{background:"#13131c",borderBottom:"1px solid #1e1e28"}}>
                      {["Wk","Loading Scheme","Backoff","Note"].map(h=><th key={h} style={{textAlign:"left",padding:"6px 9px",fontSize:8,letterSpacing:".1em",color:"#444",fontWeight:700,whiteSpace:"nowrap"}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {mc.loading[liftView].map((row,i)=>(
                        <tr key={i} style={{borderBottom:"1px solid #16161e",background:i%2===1?"#0d0d16":"transparent"}}>
                          <td style={{padding:"7px 9px",fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:col,whiteSpace:"nowrap",fontWeight:700}}>{row.wk}</td>
                          <td style={{padding:"7px 9px",fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#A09878",lineHeight:1.6,maxWidth:180}}>{row.scheme}</td>
                          <td style={{padding:"7px 9px",fontSize:9,color:"#706050",lineHeight:1.6,maxWidth:130}}>{row.backoff||"—"}</td>
                          <td style={{padding:"7px 9px",fontSize:9,color:"#504030",lineHeight:1.6,maxWidth:150}}>{row.note}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              <div style={{padding:"10px 16px",borderBottom:"1px solid #1a1a24",background:"#0e0e14"}}>
                <div style={{fontSize:8,letterSpacing:".18em",color:"#444",marginBottom:7,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>RUNNING — {mc.name}</div>
                <div style={{display:"flex",flexDirection:"column",gap:4}}>
                  {[["🟢 EASY (TUE)",mc.running.easy,"#20884A"],["🔵 TEMPO (WED PM)",mc.running.tempo,"#2a82c4"],["🔴 TRACK (FRI)",mc.running.track,"#D03515"]].map(([lbl,txt,c])=>(
                    <div key={lbl} style={{background:"#111116",border:`1px solid ${c}1e`,borderLeft:`3px solid ${c}`,borderRadius:5,padding:"7px 11px"}}>
                      <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,fontWeight:700,color:c,letterSpacing:".06em",marginBottom:3}}>{lbl}</div>
                      <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#A09878",lineHeight:1.7}}>{txt}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{padding:"10px 16px",borderBottom:"1px solid #1a1a24"}}>
                <div style={{background:`${col}08`,border:`1px solid ${col}20`,borderRadius:7,padding:"10px 13px"}}>
                  <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,fontWeight:700,color:col,letterSpacing:".12em",marginBottom:5}}>⚡ SAT PM — {mc.conditioning.label}</div>
                  <div style={{fontSize:10,color:"#666",marginBottom:8,lineHeight:1.7,fontStyle:"italic"}}>{mc.conditioning.desc}</div>
                  {mc.conditioning.sessions.map((s,i)=><div key={i} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#A09878",marginBottom:5,lineHeight:1.7,paddingLeft:9,borderLeft:`2px solid ${col}30`}}>{s}</div>)}
                </div>
              </div>

              <div style={{padding:"13px 16px 52px"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:dCol,letterSpacing:".04em"}}>{day.label}</div>
                    <div style={{fontSize:10,color:"#666",marginTop:2}}>{day.sub}</div>
                    {sessionCount>0&&<div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#444",marginTop:3}}>{sessionCount} session{sessionCount!==1?"s":""} logged for this day</div>}
                  </div>
                  <button onClick={()=>setLogging(true)} style={{flexShrink:0,padding:"8px 14px",background:`${dCol}18`,border:`1px solid ${dCol}`,borderRadius:5,color:dCol,fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:700,letterSpacing:".06em",marginTop:2}}>
                    📝 LOG SESSION
                  </button>
                </div>

                {lastSess&&(
                  <div style={{background:"#111116",border:`1px solid ${dCol}20`,borderRadius:6,padding:"8px 12px",marginBottom:10}}>
                    <div style={{fontSize:8,letterSpacing:".12em",color:"#444",marginBottom:5}}>LAST LOGGED — {lastSess.date} · Wk {lastSess.weekNum}</div>
                    <div style={{display:"flex",flexWrap:"wrap",gap:"3px 14px"}}>
                      {Object.entries(lastSess.entries||{}).slice(0,6).map(([name,data])=>{
                        const vals=[data.weight&&`${data.weight}lb`,data.setsreps,data.rpe&&`RPE${data.rpe}`,data.dist&&`${data.dist}mi`,data.time].filter(Boolean).join(" ");
                        if(!vals)return null;
                        return(<div key={name} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#666"}}>{name.replace(/★+/g,"").trim().slice(0,20)}: <span style={{color:"#A09878"}}>{vals}</span></div>);
                      })}
                    </div>
                    {lastSess.note&&<div style={{fontSize:9,color:"#444",marginTop:5,fontStyle:"italic"}}>{lastSess.note.slice(0,80)}{lastSess.note.length>80?"...":""}</div>}
                  </div>
                )}

                <div style={{overflowX:"auto",borderRadius:7,border:"1px solid #1e1e28"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",minWidth:460}}>
                    <thead><tr style={{background:"#13131c",borderBottom:"1px solid #1e1e28"}}>
                      {["Exercise","Protocol","Notes & Cues"].map(h=><th key={h} style={{textAlign:"left",padding:"7px 10px",fontSize:8,letterSpacing:".12em",color:"#444",fontWeight:700}}>{h}</th>)}
                    </tr></thead>
                    <tbody>
                      {day.exercises.map((ex,i)=>{
                        const isPrimary=ex.name.includes("★★★");
                        const isKey=ex.name.includes("★")||ex.name.startsWith("—");
                        return(
                          <tr key={i} style={{borderBottom:"1px solid #16161e",background:i%2===1?"#0d0d16":"transparent"}}>
                            <td style={{padding:"9px 10px",fontWeight:isPrimary?800:isKey?700:500,color:isPrimary?dCol:isKey?`${dCol}99`:"#D4C8B8",fontSize:isPrimary?12:11,lineHeight:1.4,verticalAlign:"top",whiteSpace:"nowrap",borderLeft:isPrimary?`3px solid ${dCol}`:"3px solid transparent"}}>{ex.name}</td>
                            <td style={{padding:"9px 10px",fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:"#A09878",lineHeight:1.7,verticalAlign:"top",maxWidth:230}}>{ex.protocol}</td>
                            <td style={{padding:"9px 10px",fontSize:10,color:"#686050",lineHeight:1.7,verticalAlign:"top",maxWidth:200}}>{ex.note}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
