function App() {
  const [activeMC, setActiveMC] = useState(0);
  const [activeDay, setActiveDay] = useState(0);
  const [liftView, setLiftView] = useState("deadlift");

  const mc = mesocycles[activeMC];
  const day = days[activeDay];
  const col = mc.col;
  const dCol = dayColors[day.type] || "#555";

  return (
    <div style={{fontFamily:"'Barlow',system-ui,sans-serif",background:"#0A0A0E",minHeight:"100vh",color:"#E0D8CC"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');*{box-sizing:border-box;}::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}button{cursor:pointer;transition:all .15s;}`}</style>

      {/* HEADER */}
      <div style={{padding:"16px",borderBottom:"1px solid #1e1e2a",background:"#0A0A0E"}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900,letterSpacing:".07em",color:"#20884A",lineHeight:1}}>SANCTUM — PHASE III</div>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,letterSpacing:".2em",color:"#444",marginTop:2}}>20-WEEK · STRENGTH + HYROX + RUNNING HYBRID</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:"5px 18px",marginTop:8}}>
          {[["Structure","4 Lift + 3 Run + HYROX/wk"],["Event","Mock HYROX — Week 20"],["Periodization","Undulating (DUP) across 5 mesocycles"],["Goal","Strong · Lean · Mobile · Capable"]].map(([k,v])=>(
            <div key={k} style={{fontSize:10}}><span style={{color:"#444"}}>{k}: </span><span style={{color:"#20884A",fontFamily:"'JetBrains Mono',monospace"}}>{v}</span></div>
          ))}
        </div>
      </div>

      {/* WEEKLY SCHEDULE STRIP */}
      <div style={{padding:"10px 16px 10px",borderBottom:"1px solid #1a1a24",background:"#0e0e14"}}>
        <div style={{fontSize:9,letterSpacing:".18em",color:"#3a3a44",marginBottom:6,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>WEEKLY TEMPLATE</div>
        <div style={{display:"flex",gap:5,overflowX:"auto",paddingBottom:2}}>
          {days.map((d,i)=>{
            const dc = dayColors[d.type]||"#444";
            return (
              <button key={i} onClick={()=>setActiveDay(i)} style={{flexShrink:0,background:i===activeDay?`${dc}18`:"#0f0f16",border:`1px solid ${i===activeDay?dc:"#1e1e28"}`,borderRadius:6,padding:"7px 10px",textAlign:"left",minWidth:78}}>
                <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:8,color:dc,letterSpacing:".08em"}}>{d.weekday}</div>
                <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700,color:i===activeDay?"#E0D8CC":"#555",marginTop:2,lineHeight:1.2}}>{d.label}</div>
              </button>
            );
          })}
        </div>
      </div>

      {/* MESOCYCLE TABS */}
      <div style={{display:"flex",overflowX:"auto",borderBottom:"1px solid #1a1a24",background:"#0e0e14"}}>
        {mesocycles.map((m,i)=>(
          <button key={i} onClick={()=>setActiveMC(i)} style={{flexShrink:0,padding:"10px 14px",border:"none",borderBottom:`2px solid ${activeMC===i?m.col:"transparent"}`,background:activeMC===i?`${m.col}10`:"transparent",color:activeMC===i?m.col:"#555",textAlign:"left"}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:9,letterSpacing:".1em",fontWeight:700}}>{m.name}</div>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:12,fontWeight:700,color:activeMC===i?"#E0D8CC":"#444",marginTop:1}}>{m.label}</div>
            <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:9,color:"#3a3a44",marginTop:1}}>{m.weeks}</div>
          </button>
        ))}
      </div>

      {/* MC OVERVIEW */}
      <div style={{padding:"12px 16px",borderBottom:"1px solid #1a1a24",background:"#0e0e16"}}>
        <div style={{fontSize:11,color:"#999",fontStyle:"italic",borderLeft:`3px solid ${col}`,paddingLeft:10,marginBottom:8}}>"{mc.analogy}"</div>
        <div style={{fontSize:11,color:"#777",marginBottom:8}}>{mc.focus}</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:8}}>
          {mc.goals.map(g=>(
            <div key={g} style={{fontSize:10,padding:"3px 8px",background:`${col}0d`,border:`1px solid ${col}1e`,borderRadius:4,color:"#aaa"}}>{g}</div>
          ))}
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {mc.dupPattern.map((d,i)=>(
            <div key={i} style={{fontSize:9,padding:"3px 8px",background:"#111116",border:"1px solid #1e1e28",borderRadius:4,color:"#555",fontFamily:"'JetBrains Mono',monospace"}}>{d}</div>
          ))}
        </div>
      </div>

      {/* LOADING TABLE */}
      <div style={{padding:"12px 16px",borderBottom:"1px solid #1a1a24"}}>
        <div style={{fontSize:9,letterSpacing:".18em",color:"#444",marginBottom:8,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>PRIMARY LIFT LOADING — {mc.name}</div>
        <div style={{display:"flex",gap:4,marginBottom:8,flexWrap:"wrap"}}>
          {[["deadlift","DEADLIFT"],["frontSquat","FRONT SQ"],["backSquat","BACK SQ"],["bench","BENCH"]].map(([k,lbl])=>(
            <button key={k} onClick={()=>setLiftView(k)} style={{padding:"4px 10px",border:`1px solid ${liftView===k?col:"#252530"}`,background:liftView===k?`${col}14`:"#111116",color:liftView===k?col:"#555",borderRadius:4,fontSize:10,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,letterSpacing:".05em"}}>{lbl}</button>
          ))}
        </div>
        <div style={{overflowX:"auto",borderRadius:6,border:"1px solid #1e1e28"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:380}}>
            <thead>
              <tr style={{background:"#13131c",borderBottom:"1px solid #1e1e28"}}>
                {["Week","Loading Scheme","Backoff / Accessories","Note"].map(h=>(
                  <th key={h} style={{textAlign:"left",padding:"7px 10px",fontSize:9,letterSpacing:".1em",color:"#444",fontWeight:700,whiteSpace:"nowrap"}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {mc.loading[liftView].map((row,i)=>(
                <tr key={i} style={{borderBottom:"1px solid #16161e",background:i%2===1?"#0d0d16":"transparent"}}>
                  <td style={{padding:"8px 10px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:col,whiteSpace:"nowrap",fontWeight:700}}>Wk {row.wk}</td>
                  <td style={{padding:"8px 10px",fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#A09878",lineHeight:1.6,maxWidth:180}}>{row.scheme}</td>
                  <td style={{padding:"8px 10px",fontSize:10,color:"#706050",lineHeight:1.6,maxWidth:150}}>{row.backoff||"—"}</td>
                  <td style={{padding:"8px 10px",fontSize:10,color:"#504030",lineHeight:1.6,maxWidth:160}}>{row.note||""}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>

      {/* RUNNING */}
      <div style={{padding:"12px 16px",borderBottom:"1px solid #1a1a24",background:"#0e0e14"}}>
        <div style={{fontSize:9,letterSpacing:".18em",color:"#444",marginBottom:8,fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700}}>RUNNING PRESCRIPTION — {mc.name}</div>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {[["🟢 EASY — Tuesday",mc.running.easy,"#20884A"],["🔵 TEMPO — Wednesday PM",mc.running.tempo,"#2a82c4"],["🔴 TRACK — Friday",mc.running.track,"#D03515"]].map(([label,text,c])=>(
            <div key={label} style={{background:"#111116",border:`1px solid ${c}20`,borderLeft:`3px solid ${c}`,borderRadius:6,padding:"8px 12px"}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700,color:c,letterSpacing:".06em",marginBottom:4}}>{label}</div>
              <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#A09878",lineHeight:1.7}}>{text}</div>
            </div>
          ))}
        </div>
      </div>

      {/* CONDITIONING */}
      <div style={{padding:"12px 16px",borderBottom:"1px solid #1a1a24"}}>
        <div style={{background:`${col}08`,border:`1px solid ${col}22`,borderRadius:8,padding:"12px 14px"}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:10,fontWeight:700,color:col,letterSpacing:".12em",marginBottom:6}}>⚡ SAT PM — {mc.conditioning.label}</div>
          <div style={{fontSize:11,color:"#777",marginBottom:10,lineHeight:1.7,fontStyle:"italic"}}>{mc.conditioning.desc}</div>
          {mc.conditioning.sessions.map((s,i)=>(
            <div key={i} style={{fontFamily:"'JetBrains Mono',monospace",fontSize:10,color:"#A09878",marginBottom:6,lineHeight:1.7,paddingLeft:10,borderLeft:`2px solid ${col}35`}}>{s}</div>
          ))}
        </div>
      </div>

      {/* DAY EXERCISES */}
      <div style={{padding:"14px 16px 52px"}}>
        <div style={{marginBottom:12}}>
          <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:dCol,letterSpacing:".04em"}}>{day.label}</div>
          <div style={{fontSize:11,color:"#777",marginTop:2}}>{day.sub}</div>
          {day.dayNote&&<div style={{fontSize:10,color:"#4a4a54",marginTop:6,fontStyle:"italic",paddingLeft:8,borderLeft:`2px solid ${dCol}35`,lineHeight:1.6}}>{day.dayNote}</div>}
        </div>
        <div style={{overflowX:"auto",borderRadius:8,border:"1px solid #1e1e28"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:480}}>
            <thead>
              <tr style={{background:"#13131c",borderBottom:"1px solid #1e1e28"}}>
                {["Exercise","Protocol","Notes & Cues"].map(h=>(
                  <th key={h} style={{textAlign:"left",padding:"8px 10px",fontSize:9,letterSpacing:".12em",color:"#444",fontWeight:700}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {day.exercises.map((ex,i)=>{
                const isPrimary=ex.name.includes("★★★");
                const isKey=ex.name.includes("★")||ex.name.startsWith("—");
                return(
                  <tr key={i} style={{borderBottom:"1px solid #16161e",background:i%2===1?"#0d0d16":"transparent"}}>
                    <td style={{padding:"10px 10px",fontWeight:isPrimary?800:isKey?700:500,color:isPrimary?dCol:isKey?`${dCol}99`:"#D4C8B8",fontSize:isPrimary?13:12,lineHeight:1.4,verticalAlign:"top",whiteSpace:"nowrap",borderLeft:isPrimary?`3px solid ${dCol}`:"3px solid transparent"}}>{ex.name}</td>
                    <td style={{padding:"10px 10px",fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:"#A09878",lineHeight:1.7,verticalAlign:"top",maxWidth:240}}>{ex.protocol}</td>
                    <td style={{padding:"10px 10px",fontSize:10,color:"#686050",lineHeight:1.7,verticalAlign:"top",maxWidth:220}}>{ex.note}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
